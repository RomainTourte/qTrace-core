plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.qtrace'
version = '1.1.4'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.scijava.org/content/repositories/public' }
}

ext.qupathVersion = '0.5.1'

javafx {
    version       = '21'
    modules       = ['javafx.controls', 'javafx.graphics', 'javafx.fxml', 'javafx.base']
    configuration = 'compileOnly'
}

dependencies {
    compileOnly "io.github.qupath:qupath-core:${qupathVersion}"
    compileOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.7.0.202309050840-r'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// ── Screenshot harness (docs/user-guide/screenshots/*.png) ─────────────────
// Separate source set — NOT part of `test`/`check`, so it never runs in the
// pre-commit hook or CI. Needs a real display (X11) or `xvfb-run`; JavaFX
// runs its normal (non-headless) toolkit, just against an offscreen window.
// See docs/user-guide/screenshots/README.md.
sourceSets {
    screenshots {
        java.srcDir 'src/screenshots/java'
    }
}

configurations {
    screenshotsImplementation.extendsFrom implementation
    screenshotsRuntimeOnly.extendsFrom runtimeOnly
}

// Linux-only classifier — qtrace's own dev machine. macOS/Windows contributors
// running this task should swap 'linux' for 'mac'/'mac-aarch64'/'win' below.
ext.javafxRuntimeVersion = '21.0.2'
ext.javafxPlatform = 'linux'

dependencies {
    screenshotsImplementation sourceSets.main.output
    screenshotsImplementation "io.github.qupath:qupath-core:${qupathVersion}"
    screenshotsImplementation "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    screenshotsImplementation 'com.google.code.gson:gson:2.10.1'
    screenshotsImplementation 'org.mockito:mockito-core:5.14.2'
    ['base', 'graphics', 'controls', 'fxml', 'swing'].each { mod ->
        screenshotsImplementation "org.openjfx:javafx-${mod}:${javafxRuntimeVersion}:${javafxPlatform}"
    }
}

tasks.register('screenshotsUI', JavaExec) {
    group = 'documentation'
    description = 'Regenerates docs/user-guide/screenshots/*.png automatically (no user interaction). ' +
                   'Needs a display: run directly, or prefix with `xvfb-run -a` for a fully invisible run.'
    classpath = sourceSets.screenshots.runtimeClasspath
    mainClass = 'io.qtrace.screenshots.ScreenshotHarness'
    // Isolated fake home — never touches the real ~/.qTrace/config.json or export dir.
    systemProperty 'user.home', "${buildDir}/screenshot-home"
    systemProperty 'qtrace.screenshots.outDir', "${rootDir}/../docs/user-guide/screenshots"
    // Dashboard capture is opt-in (real local .qtrace data — contributor names, project
    // names) — off unless a Gradle project property points at fixtures you've reviewed:
    //   ./gradlew screenshotsUI -PdashboardFixtures=/path/to/reviewed/qtrace/files
    if (project.hasProperty('dashboardFixtures')) {
        systemProperty 'qtrace.screenshots.fixturesDir', project.property('dashboardFixtures')
    }
}

jar {
    archiveBaseName = 'qtrace-core'
    manifest {
        attributes 'Implementation-Title':   'QTrace Core',
                   'Implementation-Version': version,
                   'Built-By':               'Romain Tourte'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'qupath/**', 'javafx/**', 'com/sun/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
